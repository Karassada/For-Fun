<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rise Tarnished — Elden Ring Build Guide</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0a;--bg-card:#111;--border:#1e1a12;--border-gold:#3a2e12;
  --gold:#c9a840;--gold-dim:#7a6228;--gold-bright:#e8c660;
  --text:#d4c5a0;--text-dim:#7a6e58;--text-muted:#3d3526;
  --str:#c0392b;--dex:#2980b9;--int:#8e44ad;--fth:#d4a017;--arc:#922b21;--hybrid:#16a085;
  --below:#27ae60;--soft:#e8c030;--hard:#e74c3c;
}
body{background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 15% 15%,#1a0d00 0%,transparent 55%),radial-gradient(ellipse at 85% 85%,#0d0820 0%,transparent 55%);pointer-events:none;z-index:0}

.wrap{position:relative;z-index:1;max-width:1440px;margin:0 auto;padding:0 24px}

/* LANG BUTTON */
.lang-btn{position:fixed;top:16px;right:20px;z-index:100;background:transparent;border:1px solid var(--border-gold);color:var(--gold);padding:8px 16px;font-family:inherit;font-size:12px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .2s}
.lang-btn:hover{background:rgba(201,168,64,.08);border-color:var(--gold)}

/* HEADER */
header{text-align:center;padding:52px 20px 28px;border-bottom:1px solid var(--border-gold);position:relative;margin-bottom:0}
header::after{content:'';position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);width:240px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);box-shadow:0 0 24px var(--gold-dim)}
.eyebrow{color:var(--gold-dim);font-size:11px;letter-spacing:7px;text-transform:uppercase;margin-bottom:14px}
h1{font-size:clamp(1.8rem,5vw,3.2rem);color:var(--gold);text-transform:uppercase;letter-spacing:10px;text-shadow:0 0 60px rgba(201,168,64,.35);font-weight:normal}
.h1-sub{color:var(--text-dim);font-size:12px;letter-spacing:4px;text-transform:uppercase;margin-top:10px}

/* LEVEL SELECTOR */
.level-selector{display:flex;justify-content:center;gap:8px;padding:28px 0 20px;flex-wrap:wrap}
.level-btn{background:transparent;border:1px solid var(--border-gold);color:var(--text-dim);padding:10px 26px;font-family:inherit;font-size:13px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .2s}
.level-btn:hover{color:var(--gold);border-color:var(--gold);background:rgba(201,168,64,.04)}
.level-btn.active{color:#0a0a0a;background:var(--gold);border-color:var(--gold);font-weight:bold}

/* DIVIDER */
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--border-gold),transparent);margin:4px 0 20px}

/* CONTROLS */
.controls{display:flex;gap:12px;padding:0 0 8px;flex-wrap:wrap;align-items:center}
.search-input{background:#0e0e0e;border:1px solid var(--border-gold);color:var(--text);padding:9px 14px;font-family:inherit;font-size:13px;outline:none;width:220px;transition:border-color .2s}
.search-input:focus{border-color:var(--gold)}
.search-input::placeholder{color:var(--text-muted)}
.ctrl-label{color:var(--text-muted);font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-right:2px}
.filter-group{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.fbtn{background:transparent;border:1px solid var(--border);color:var(--text-dim);padding:7px 12px;font-family:inherit;font-size:11px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .2s}
.fbtn:hover{border-color:var(--gold-dim);color:var(--text)}
.fbtn.active{border-color:var(--gold);color:var(--gold);background:rgba(201,168,64,.06)}
.fbtn.s-str.active{border-color:var(--str);color:var(--str);background:rgba(192,57,43,.06)}
.fbtn.s-dex.active{border-color:var(--dex);color:var(--dex);background:rgba(41,128,185,.06)}
.fbtn.s-int.active{border-color:var(--int);color:var(--int);background:rgba(142,68,173,.06)}
.fbtn.s-fth.active{border-color:var(--fth);color:var(--fth);background:rgba(212,160,23,.06)}
.fbtn.s-arc.active{border-color:var(--arc);color:var(--arc);background:rgba(146,43,33,.06)}
.fbtn.s-hyb.active{border-color:var(--hybrid);color:var(--hybrid);background:rgba(22,160,133,.06)}
.sort-sel{background:#0e0e0e;border:1px solid var(--border-gold);color:var(--text-dim);padding:7px 12px;font-family:inherit;font-size:12px;cursor:pointer;outline:none}

/* LEGEND */
.legend{display:flex;gap:20px;padding:10px 16px;background:#0c0c0c;border:1px solid var(--border);margin-bottom:20px;flex-wrap:wrap;align-items:center}
.legend-title{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted)}
.leg-item{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text-dim)}
.leg-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.caps-list{display:flex;gap:10px;flex-wrap:wrap;font-size:10px;color:var(--text-muted);letter-spacing:.5px}
.cap-entry b{color:var(--text-dim)}

/* RESULTS BAR */
.results-bar{display:flex;justify-content:space-between;align-items:center;padding:4px 0 16px;color:var(--text-muted);font-size:11px;letter-spacing:1px;text-transform:uppercase}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px;padding-bottom:60px}

/* CARD */
.card{background:var(--bg-card);border:1px solid var(--border);padding:18px 20px;transition:border-color .2s,transform .18s;position:relative;overflow:hidden;cursor:default}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;opacity:0;transition:opacity .2s}
.card:hover{border-color:var(--border-gold);transform:translateY(-2px)}
.card:hover::before{opacity:1}
.card[data-primary="STR"]::before{background:var(--str)}
.card[data-primary="DEX"]::before{background:var(--dex)}
.card[data-primary="INT"]::before{background:var(--int)}
.card[data-primary="FTH"]::before{background:var(--fth)}
.card[data-primary="ARC"]::before{background:var(--arc)}
.card[data-hybrid="1"]::before{background:var(--hybrid)}

/* CARD HEADER */
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:10px}
.card-top-left{display:flex;gap:10px;align-items:flex-start;flex:1;min-width:0}
.wnum{color:var(--text-muted);font-size:10px;letter-spacing:1px;margin-bottom:3px}
.wname-main{font-size:1.1rem;color:var(--gold);font-weight:normal;letter-spacing:.5px;line-height:1.2}
.wname-sub{font-size:11px;color:var(--text-dim);margin-top:2px}
.badges{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.badge{font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border:1px solid}
.badge-base{color:#8a9a6a;border-color:#3a4a2a}
.badge-dlc{color:var(--gold);border-color:var(--gold-dim)}
.badge-type{color:var(--text-muted);border-color:var(--border)}

/* PRIMARY STAT BADGE */
.primary-badge{display:inline-block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;padding:2px 10px;border:1px solid;margin-bottom:9px}
.pb-STR{color:var(--str);border-color:var(--str)}
.pb-DEX{color:var(--dex);border-color:var(--dex)}
.pb-INT{color:var(--int);border-color:var(--int)}
.pb-FTH{color:var(--fth);border-color:var(--fth)}
.pb-ARC{color:var(--arc);border-color:var(--arc)}
.pb-hybrid{color:var(--hybrid);border-color:var(--hybrid)}

/* STAT BARS */
.stat-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.slabel{width:52px;font-size:10px;letter-spacing:.5px;color:var(--text-muted);flex-shrink:0;white-space:nowrap}
.sbar-wrap{flex:1;height:7px;background:#161616;position:relative;overflow:visible}
.sbar-fill{height:100%;transition:width .45s cubic-bezier(.4,0,.2,1),background-color .45s ease;position:relative}
.sbar-fill.below{background:var(--below)}
.sbar-fill.soft{background:var(--soft);box-shadow:0 0 5px rgba(232,192,48,.4)}
.sbar-fill.hard{background:var(--hard);box-shadow:0 0 8px rgba(231,76,60,.5)}
/* soft/hard cap tick marks */
.sbar-wrap .tick{position:absolute;top:-1px;bottom:-1px;width:1px;background:rgba(255,255,255,.12);pointer-events:none}
.sval{width:26px;font-size:11px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums;transition:color .3s}
.sval.below{color:var(--below)}
.sval.soft{color:var(--soft)}
.sval.hard{color:var(--hard)}

/* AR SECTION */
.ar-row{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
.ar-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted)}
.ar-val{font-size:1.35rem;color:var(--gold);font-weight:normal;letter-spacing:2px}
.ar-val.none{color:var(--text-muted);font-size:.85rem;letter-spacing:1px}

/* NOTES */
.bnotes{font-size:11px;color:var(--text-dim);margin-top:6px;line-height:1.55;font-style:italic}

/* INFUSION */
.infusion{font-size:10px;color:var(--text-muted);margin-bottom:8px}
.infusion em{color:var(--text-dim);font-style:normal}

/* WEAPON IMAGE */
.wimg-wrap{width:56px;height:56px;flex-shrink:0;background:#0a0a0a;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden}
.wimg{width:52px;height:52px;object-fit:contain;filter:drop-shadow(0 0 5px rgba(201,168,64,.18))}
.wimg-missing{width:52px;height:52px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:16px;opacity:.4}

/* EMPTY */
.empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--text-muted);letter-spacing:4px;text-transform:uppercase;font-size:.9rem}

/* SCROLLBAR */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#060606}
::-webkit-scrollbar-thumb{background:var(--border-gold)}

@media(max-width:600px){
  .grid{grid-template-columns:1fr}
  h1{letter-spacing:5px}
  .controls{gap:8px}
  .search-input{width:100%}
  .lang-btn{top:10px;right:10px;padding:6px 10px;font-size:10px}
}
</style>
</head>
<body>

<!-- LANGUAGE TOGGLE -->
<button class="lang-btn" id="lang-btn">JP</button>

<div class="wrap">

<header>
  <div class="eyebrow" data-i18n="eyebrow">Base Game + Shadow of the Erdtree · Patch 1.12+</div>
  <h1 data-i18n="title">Rise, Tarnished</h1>
  <div class="h1-sub" data-i18n="subtitle">Elden Ring · Optimal Weapon Builds</div>
</header>

<!-- LEVEL SELECTOR -->
<div class="level-selector">
  <button class="level-btn" data-rl="base" data-i18n="baseReq">Base Req.</button>
  <button class="level-btn active" data-rl="150">Level 150</button>
  <button class="level-btn" data-rl="200">Level 200</button>
  <button class="level-btn" data-rl="250">Level 250</button>
  <button class="level-btn" data-rl="300">Level 300</button>
</div>

<div class="divider"></div>

<!-- CONTROLS -->
<div class="controls">
  <input class="search-input" id="search" type="text" placeholder="Search weapon…" data-i18n-placeholder="searchPlaceholder">

  <span class="ctrl-label" data-i18n="statFilter">Stat</span>
  <div class="filter-group" id="stat-filters">
    <button class="fbtn active" data-stat="all" data-i18n="all">All</button>
    <button class="fbtn s-str" data-stat="STR" data-i18n-stat="STR">STR</button>
    <button class="fbtn s-dex" data-stat="DEX" data-i18n-stat="DEX">DEX</button>
    <button class="fbtn s-int" data-stat="INT" data-i18n-stat="INT">INT</button>
    <button class="fbtn s-fth" data-stat="FTH" data-i18n-stat="FTH">FTH</button>
    <button class="fbtn s-arc" data-stat="ARC" data-i18n-stat="ARC">ARC</button>
    <button class="fbtn s-hyb" data-stat="hybrid" data-i18n="hybrid">Hybrid</button>
  </div>

  <span class="ctrl-label" data-i18n="sourceFilter">Source</span>
  <div class="filter-group" id="src-filters">
    <button class="fbtn active" data-src="all" data-i18n="all">All</button>
    <button class="fbtn" data-src="Base Game" data-i18n="base">Base</button>
    <button class="fbtn" data-src="DLC">DLC</button>
  </div>

  <span class="ctrl-label" data-i18n="sortFilter">Sort</span>
  <select class="sort-sel" id="sort-sel">
    <option value="default" data-i18n="sortDefault">Default (#)</option>
    <option value="ar-desc" data-i18n="sortArDesc">AR High→Low</option>
    <option value="ar-asc" data-i18n="sortArAsc">AR Low→High</option>
    <option value="name" data-i18n="sortName">Name A→Z</option>
  </select>
</div>

<!-- LEGEND -->
<div class="legend">
  <span class="legend-title" data-i18n="softCaps">Soft Caps</span>
  <div class="caps-list">
    <span class="cap-entry"><b data-i18n-stat="VIG">VIG</b> 40|60</span>
    <span class="cap-entry"><b data-i18n-stat="MND">MND</b> 55|60</span>
    <span class="cap-entry"><b data-i18n-stat="END">END</b> 50|99</span>
    <span class="cap-entry"><b data-i18n-stat="STR">STR</b> 54|80</span>
    <span class="cap-entry"><b data-i18n-stat="DEX">DEX</b> 60|80</span>
    <span class="cap-entry"><b data-i18n-stat="INT">INT</b> 60|80</span>
    <span class="cap-entry"><b data-i18n-stat="FTH">FTH</b> 60|80</span>
    <span class="cap-entry"><b data-i18n-stat="ARC">ARC</b> 45|60</span>
  </div>
  <div style="margin-left:auto;display:flex;gap:16px;flex-wrap:wrap">
    <div class="leg-item"><div class="leg-dot" style="background:var(--below)"></div><span data-i18n="belowSoft">Below soft cap</span></div>
    <div class="leg-item"><div class="leg-dot" style="background:var(--soft)"></div><span data-i18n="softCapDim">Soft cap (diminishing)</span></div>
    <div class="leg-item"><div class="leg-dot" style="background:var(--hard)"></div><span data-i18n="hardCapMax">Hard cap (max)</span></div>
  </div>
</div>

<div class="results-bar">
  <span id="result-count"></span>
  <span id="rl-label"></span>
</div>

<!-- GRID -->
<div class="grid" id="grid"></div>

</div><!-- /wrap -->

<script>
const SOFT = {VIG:{s1:40,s2:60},MND:{s1:55,s2:60},END:{s1:50,s2:99},STR:{s1:54,s2:80},DEX:{s1:60,s2:80},INT:{s1:60,s2:80},FTH:{s1:60,s2:80},ARC:{s1:45,s2:60}};
const STATS = ['VIG','MND','END','STR','DEX','INT','FTH','ARC'];

/* ── TRANSLATIONS ── */
const TRANSLATIONS = {
  en: {
    eyebrow: 'Base Game + Shadow of the Erdtree · Patch 1.12+',

    softCaps: 'Soft Caps',

    primaryLabel: (p) => p,

      'Curved Greatsword':'Curved Greatsword','Katana':'Katana','Great Katana':'Great Katana',

      'Colossal Weapon':'Colossal Weapon','Spear':'Spear','Great Spear':'Great Spear',

    },

    reqOnly: '要求値のみ',

    weapons: (n) => `${n}件の武器`,

    rlLevel: (n) => `表示中: レベル ${n}`,
    stats: {VIG:'生命力',MND:'精神力',END:'持久力',STR:'筋力',DEX:'技量',INT:'知力',FTH:'信仰',ARC:'神秘'},

      const map = {VIG:'生命力',MND:'精神力',END:'持久力',STR:'筋力',DEX:'技量',INT:'知力',FTH:'信仰',ARC:'神秘'};
      return p.split('/').map(x => map[x] || x).join('/');
    },
    srcMap: {'Base Game':'本編','DLC':'DLC'},

      'Dagger':'短剣','Straight Sword':'直剣','Greatsword':'大剣','Colossal Sword':'特大剣',
      'Thrusting Sword':'刺剣','Heavy Thrusting Sword':'重刺剣','Curved Sword':'曲剣',
      'Curved Greatsword':'大曲剣','Katana':'刀','Great Katana':'大刀','Twinblade':'双剣',

      if (!n) return n;

        .replace(/Minimum requirements only — no stat optimization\./g,'最低要求値のみ — ステータス最適化なし。')

        .replace(/Surplus into END\/MND\./g,'余りをEND/MNDへ。').replace(/Surplus into END\./g,'余りをENDへ。')

let curLang = 'en';
let curRL = '150';
let curStat = 'all';

function T() { return TRANSLATIONS[curLang]; }

/* ── APPLY LANGUAGE TO STATIC ELEMENTS ── */
function applyLang() {
  const t = T();
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (t[key] !== undefined) el.textContent = t[key];
  });
  document.querySelectorAll('[data-i18n-stat]').forEach(el => {
    const stat = el.dataset.i18nStat;
    el.textContent = t.stats[stat] || stat;
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.dataset.i18nPlaceholder;
    if (t[key] !== undefined) el.placeholder = t[key];
  });
  document.querySelectorAll('#sort-sel option[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (t[key] !== undefined) el.textContent = t[key];
  });
  document.getElementById('lang-btn').textContent = t.langToggle;
  document.documentElement.lang = curLang;
  document.querySelectorAll('.level-btn[data-rl]').forEach(btn => {
    const rl = btn.dataset.rl;
    if (rl !== 'base') btn.textContent = t.levelWord + ' ' + rl;
  });
}

function wikiImg(w) {
  if (WIKI_IMGS[w.name]) return WIKI_BASE + WIKI_IMGS[w.name];
  const slug = w.name.toLowerCase().replace(/['']/g,'').replace(/é/g,'e').replace(/\s+/g,'_').replace(/[^a-z0-9_\-]/g,'');
  const sfx = w.src === 'DLC'
    ? '_elden_ring_shadow_of_the_erdtree_dlc_wiki_guide_200px.png'
    : '_elden_ring_wiki_guide_200px.png';
  return WIKI_BASE + slug + sfx;
}

  for (const s of primaries) {
    const cap = SOFT[s];
    const target = rl<=150 ? cap.s1 : rl<=200 ? Math.round(cap.s1+(cap.s2-cap.s1)*0.5) : cap.s2;
    b[s] = Math.max(b[s], target);
  }
  return b;
}

function getBuild(w, rl) {
  if (rl === 'base') return baseBuild(w);
  if (w.builds && w.builds[rl]) return w.builds[rl];
  return autoBuild(w, rl);
}

function capClass(stat, val) {
  const c = SOFT[stat];
  if (!c) return 'below';
  if (val >= c.s2) return 'hard';
  if (val >= c.s1) return 'soft';
  return 'below';
}

function isHybrid(p) { return p.includes('/'); }

function primaryClass(p) {
  if (isHybrid(p)) return 'pb-hybrid';
  return 'pb-'+p;
}

function barFillPct(stat, val) {
  return Math.min(100, (val / 99) * 100).toFixed(1);
}

function tickPct(v) { return ((v/99)*100).toFixed(1); }

function makeCard(w, rl) {
  const b = getBuild(w, rl);
  const hy = isHybrid(w.primary) ? '1' : '0';
  const primaryData = isHybrid(w.primary) ? 'HYBRID' : w.primary;
  const t = T();

  const mainName = (curLang === 'jp' && w.jp) ? w.jp : w.name;
  const subName  = curLang === 'jp' ? w.name : (w.jp || '');

  let statRows = '';
  for (const s of STATS) {
    const v = b[s];
    const cc = capClass(s, v);
    const pct = barFillPct(s, v);
    const caps = SOFT[s];
    const t1 = tickPct(caps.s1);
    const t2 = caps.s2 < 99 ? `<div class="tick" style="left:${tickPct(caps.s2)}%"></div>` : '';
    const label = t.stats[s] || s;
    statRows += `
    <div class="stat-row">
      <span class="slabel">${label}</span>
      <div class="sbar-wrap">
        <div class="sbar-fill ${cc}" style="width:${pct}%"></div>
        <div class="tick" style="left:${t1}%"></div>${t2}
      </div>
      <span class="sval ${cc}">${v}</span>
    </div>`;
  }

  const arHtml = b.AR
    ? `<span class="ar-val">~${b.AR}</span>`
    : rl === 'base'
      ? `<span class="ar-val none">${t.reqOnly}</span>`
      : `<span class="ar-val none">—</span>`;

  const primaryDisplay = t.primaryLabel(w.primary);
  const infusionHtml = w.infusion ? `<div class="infusion"><em>${w.infusion}</em></div>` : '';

  const imgUrl = wikiImg(w);

  return `
  <div class="card" data-id="${w.id}" data-primary="${primaryData}" data-hybrid="${hy}" data-src="${w.src}">
    <div class="card-top">
      <div class="card-top-left">
        <div class="wimg-wrap">
          <img class="wimg" src="${imgUrl}" alt="${w.name}"
               onerror="this.parentElement.innerHTML='<div class=wimg-missing>⚔</div>'">
        </div>
        <div>
          <div class="wnum">#${String(w.id).padStart(2,'0')}</div>
          <div class="wname-main">${mainName}</div>
          ${subName ? `<div class="wname-sub">${subName}</div>` : ''}
        </div>
      </div>
      <div class="badges">
        <span class="badge ${w.src==='DLC'?'badge-dlc':'badge-base'}">${t.srcMap[w.src]||w.src}</span>
        <span class="badge badge-type">${t.typeMap[w.type]||w.type}</span>
      </div>
    </div>
    <div class="primary-badge ${primaryClass(w.primary)}">${primaryDisplay}</div>
    ${infusionHtml}
    ${statRows}
    <div class="ar-row">
      <span class="ar-label">${t.estAR}</span>
      ${arHtml}
    </div>
    <div class="bnotes">${t.translateNote(b.notes)}</div>
  </div>`;
}

function getFiltered() {
  let list = [...W];

  if (curSearch) {
    const q = curSearch.toLowerCase();
    list = list.filter(w => w.name.toLowerCase().includes(q) || (w.jp||'').includes(q));
  }

  if (curStat !== 'all') {
    if (curStat === 'hybrid') {
      list = list.filter(w => isHybrid(w.primary));
    } else {
      list = list.filter(w => w.primary.includes(curStat));
    }
  }

  if (curSrc !== 'all') {
    list = list.filter(w => w.src === curSrc);
  }

  if (curSort === 'ar-desc') {
    list.sort((a,b) => {
      const ba = getBuild(a,curRL).AR||0, bb = getBuild(b,curRL).AR||0;
      return bb - ba;
    });
  } else if (curSort === 'ar-asc') {
    list.sort((a,b) => {
      const ba = getBuild(a,curRL).AR||0, bb = getBuild(b,curRL).AR||0;
      return ba - bb;
    });
  } else if (curSort === 'name') {
    list.sort((a,b) => a.name.localeCompare(b.name));
  }

  return list;
}

function rlLabel() {
  const t = T();
  if (curRL === 'base') return t.rlBase;
  return t.rlLevel(curRL);
}

function render() {
  const list = getFiltered();
  const t = T();
  const grid = document.getElementById('grid');
  const count = document.getElementById('result-count');
  const rll = document.getElementById('rl-label');

  count.textContent = t.weapons(list.length);
  rll.textContent = rlLabel();

  if (!list.length) {
    grid.innerHTML = `<div class="empty">${t.noMatch}</div>`;
    return;
  }

  grid.innerHTML = list.map(w => makeCard(w, curRL)).join('');
}

// Level buttons
document.querySelectorAll('.level-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    curRL = btn.dataset.rl;
    render();
  });
});

// Stat filters
document.querySelectorAll('#stat-filters .fbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#stat-filters .fbtn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    curStat = btn.dataset.stat;
    render();
  });
});

// Source filters
document.querySelectorAll('#src-filters .fbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#src-filters .fbtn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    curSrc = btn.dataset.src;
    render();
  });
});

// Sort
document.getElementById('sort-sel').addEventListener('change', e => {
  curSort = e.target.value;
  render();
});

// Search
document.getElementById('search').addEventListener('input', e => {
  curSearch = e.target.value.trim();
  render();
});

// Language toggle
document.getElementById('lang-btn').addEventListener('click', () => {
  curLang = curLang === 'en' ? 'jp' : 'en';
  applyLang();
  render();
});

// Init
applyLang();
render();
</script>
</body>
</html>
